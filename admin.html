<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração | IFPE 2027</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f1f5f2;color:#203027}
header{background:#103d2b;color:white;padding:20px}
main{max-width:950px;margin:20px auto;padding:12px}
.panel{background:white;padding:18px;border-radius:12px;margin:14px 0}
input,button{padding:12px;border-radius:7px;border:1px solid #ccc;font-size:15px}
input{width:100%;margin:7px 0}
button{background:#145b3b;color:white;border:0;cursor:pointer;margin:5px 3px}
.secondary{background:#e5eee8;color:#145b3b}
nav{display:flex;flex-wrap:wrap;gap:5px}
.tab{display:none}.tab.active{display:block}
.item{padding:12px;border-bottom:1px solid #ddd}
.small{color:#68766d;font-size:13px}
#app{display:none}
</style>
</head>
<body>
<header>
<h2>IFPE 2027 — Painel administrativo</h2>
<p>Área exclusiva do administrador</p>
</header>

<main>
<section id="login" class="panel">
<h2>Entrar como administrador</h2>
<input id="email" type="email" placeholder="Seu e-mail">
<input id="password" type="password" placeholder="Sua senha">
<button onclick="login()">Entrar</button>
<p id="message" class="small"></p>
</section>

<section id="app">
<nav>
<button onclick="showTab('overview')">Visão geral</button>
<button onclick="showTab('students')">Alunos</button>
<button onclick="showTab('quizzes')">Simulados</button>
<button onclick="logout()" class="secondary">Sair</button>
</nav>

<section id="overview" class="tab active panel">
<h2>Visão geral</h2>
<p>Alunos cadastrados: <strong id="studentCount">—</strong></p>
<p>Provas realizadas: <strong id="attemptCount">—</strong></p>
</section>

<section id="students" class="tab panel">
<h2>Alunos cadastrados</h2>
<div id="studentList">Carregando...</div>
</section>

<section id="quizzes" class="tab panel">
<h2>Criar simulado</h2>
<label>Nome</label>
<input id="examTitle" placeholder="Ex.: Simulado IFPE 01">
<label>Descrição</label>
<input id="examDescription" placeholder="Conteúdos da prova">
<label>Duração em minutos</label>
<input id="examDuration" type="number" value="180">
<button onclick="createExam()">Criar simulado</button>

<h3>Simulados cadastrados</h3>
<div id="examList">Carregando...</div>
</section>
</section>
</main>

<script>
const SUPABASE_URL = "COLE_AQUI_A_URL_DO_SEU_PROJETO";
const SUPABASE_KEY = "COLE_AQUI_SUA_CHAVE_PUBLISHABLE";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function showTab(id){
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("message");
 msg.textContent="Verificando acesso...";

 const {error}=await db.auth.signInWithPassword({email,password});
 if(error){msg.textContent="Não foi possível entrar. Confira seus dados.";return;}
 await checkAdmin();
}

async function checkAdmin(){
 const {data:{user}}=await db.auth.getUser();

 if(!user){
  document.getElementById("login").style.display="block";
  document.getElementById("app").style.display="none";
  return;
 }

 const {data:profile,error}=await db
  .from("profiles")
  .select("role")
  .eq("id",user.id)
  .single();

 if(error || profile.role!=="admin"){
  await db.auth.signOut();
  document.getElementById("message").textContent=
   "Acesso negado: esta conta não é administradora.";
  return;
 }

 document.getElementById("login").style.display="none";
 document.getElementById("app").style.display="block";
 await loadDashboard();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function loadDashboard(){
 const {data:students}=await db
  .from("profiles")
  .select("id")
  .eq("role","student");

 const {data:attempts}=await db
  .from("attempts")
  .select("id");

 document.getElementById("studentCount").textContent=
  students ? students.length : "—";
 document.getElementById("attemptCount").textContent=
  attempts ? attempts.length : "—";

 await loadStudents();
 await loadExams();
}

async function loadStudents(){
 const box=document.getElementById("studentList");
 const {data,error}=await db
  .from("profiles")
  .select("full_name,created_at")
  .eq("role","student")
  .order("created_at",{ascending:false});

 if(error){box.textContent="Erro ao carregar alunos.";return;}
 box.innerHTML="";

 if(!data.length){box.textContent="Nenhum aluno cadastrado.";return;}

 data.forEach(student=>{
  const div=document.createElement("div");
  div.className="item";
  div.textContent=student.full_name || "Aluno sem nome informado";
  box.appendChild(div);
 });
}

async function createExam(){
 const title=document.getElementById("examTitle").value.trim();
 const description=document.getElementById("examDescription").value.trim();
 const duration=Number(document.getElementById("examDuration").value);

 if(!title || !Number.isInteger(duration) || duration<1){
  alert("Informe um nome e uma duração válida.");
  return;
 }

 const {error}=await db.from("exams").insert({
  title:title,
  description:description,
  duration_minutes:duration,
  published:false
 });

 if(error){alert("Erro ao criar: "+error.message);return;}

 alert("Simulado criado como rascunho!");
 document.getElementById("examTitle").value="";
 document.getElementById("examDescription").value="";
 await loadExams();
}

async function loadExams(){
 const box=document.getElementById("examList");
 const {data,error}=await db
  .from("exams")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){box.textContent="Erro ao carregar simulados.";return;}
 box.innerHTML="";

 if(!data.length){box.textContent="Nenhum simulado criado.";return;}

 data.forEach(exam=>{
  const div=document.createElement("div");
  div.className="item";

  const title=document.createElement("strong");
  title.textContent=exam.title+" — "+exam.duration_minutes+" min";

  const status=document.createElement("p");
  status.textContent=exam.published?"Publicado":"Rascunho";

  const publish=document.createElement("button");
  publish.textContent=exam.published?"Retirar publicação":"Publicar";
  publish.onclick=()=>updateExam(exam.id,{
   published:!exam.published
  });

  const key=document.createElement("button");
  key.className="secondary";
  key.textContent=exam.answer_key_released?
   "Bloquear gabarito":"Liberar gabarito";
  key.onclick=()=>updateExam(exam.id,{
   answer_key_released:!exam.answer_key_released
  });

  div.append(title,status,publish,key);
  box.appendChild(div);
 });
}

async function updateExam(id,changes){
 const {error}=await db.from("exams").update(changes).eq("id",id);
 if(error){alert("Erro ao atualizar: "+error.message);return;}
 await loadExams();
}

db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){
  document.getElementById("login").style.display="block";
  document.getElementById("app").style.display="none";
 }
});

checkAdmin();
</script>
</body>
</html>
